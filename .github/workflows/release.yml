name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

# Publishes through npm Trusted Publishing (OIDC), configured on npmjs.com for
# PapiScholz/roadmapsmith + release.yml: no NPM_TOKEN. id-token: write is what
# lets npm verify this run. The old NPM_TOKEN path failed with E404 on 1.4.2
# and 1.4.3, and npm drops publishing with 2FA-bypass tokens in January 2027.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 24 ships it.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Detect new version
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view roadmapsmith version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL" >> $GITHUB_OUTPUT
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "no version change ($LOCAL == $PUBLISHED on npm) — skipping publish"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "new version: $LOCAL (was $PUBLISHED on npm)"
          fi

      - name: Publish to npm
        if: steps.check.outputs.changed == 'true'
        run: npm publish --access public

      - name: Create GitHub release
        if: steps.check.outputs.changed == 'true'
        run: |
          gh release create "v${{ steps.check.outputs.local }}" \
            --title "v${{ steps.check.outputs.local }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
